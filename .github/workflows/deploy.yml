name: Deploy

# Builds the browser client of The Mana World and publishes it on GitHub
# Pages as play.themanaworld.org.
#
# The client source is the wasm branch of github.com/mana/mana. The settings
# baked into the page below make it connect straight to
# server.themanaworld.org through the WebSocket proxy on that host, so
# players never see the server dialog. The generic client, which shows the
# server list instead, lives at https://mana.github.io/mana/.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Sent by the client repository after a successful build of its own
  repository_dispatch:
    types: [client-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CLIENT_REPOSITORY: mana/mana
  # The branch to build. A client-updated dispatch names the branch it was
  # sent for; otherwise this default applies (change it once the browser
  # build has merged into master).
  CLIENT_REF: ${{ github.event.client_payload.ref || 'wasm' }}
  EMSDK_VERSION: 5.0.1
  # Where Emscripten keeps its built ports and system libraries
  EM_CACHE: ${{ github.workspace }}/.em-cache
  # em++ is a script whose timestamp changes with every cache restore, so
  # ccache identifies the compiler by its content instead
  CCACHE_COMPILERCHECK: content

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the client
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CLIENT_REPOSITORY }}
          ref: ${{ env.CLIENT_REF }}
          submodules: true
          path: client

      - name: Cache emsdk
        uses: actions/cache@v6
        with:
          path: emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}

      - name: Install emsdk
        run: |
          if [ ! -d emsdk ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          fi
          ./emsdk/emsdk install "$EMSDK_VERSION"
          ./emsdk/emsdk activate "$EMSDK_VERSION"
          source ./emsdk/emsdk_env.sh
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "EMSDK_NODE=$EMSDK_NODE" >> "$GITHUB_ENV"
          echo "$EMSDK" >> "$GITHUB_PATH"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Cache Emscripten ports
        uses: actions/cache@v6
        with:
          path: ${{ env.EM_CACHE }}
          key: em-cache-${{ env.EMSDK_VERSION }}-${{ hashFiles('client/src/CMakeLists.txt') }}
          restore-keys: em-cache-${{ env.EMSDK_VERSION }}-

      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: client/.cpm-cache
          key: cpm-${{ hashFiles('client/CMakeLists.txt') }}

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: play-${{ env.EMSDK_VERSION }}
          max-size: 500M

      - name: Configure
        run: >
          emcmake cmake -S client -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DMANA_WEB_SERVER=server.themanaworld.org
          -DMANA_WEB_PORT=6901
          -DMANA_WEB_PROXY_URL=wss://server.themanaworld.org/tmwa/
          -DMANA_WEB_UPDATE_HOST=https://updates.themanaworld.org/

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Assemble site
        run: |
          mkdir site
          cp build/src/mana.js build/src/mana.wasm build/src/mana.data site/
          cp build/src/mana.html site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
